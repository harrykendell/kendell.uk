<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171716" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Kendell projects and tools.">
  <title>Kendell</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Kendell home">
        <img class="brand-mark" src="favicon.svg" alt="">
        <span>kendell.uk</span>
      </a>
      <a class="github-link" href="https://github.com/harrykendell">GitHub</a>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Projects</h1>
        <p>Lab software and workshop tools.</p>
      </section>

      <nav class="project-list" aria-label="Projects">
        <a class="project-row" href="https://artiq.kendell.uk/">
          <img class="project-logo" src="https://artiq.kendell.uk/assets/artiq-lab-viewer-icon.svg" alt="">
          <span class="project-copy">
            <span class="project-title">ARTIQ lab tools</span>
            <span class="project-description">Experiment viewer, archive and control.</span>
          </span>
          <span class="project-arrow" aria-hidden="true">↗</span>
        </a>

        <a class="project-row" href="https://repairs.kendell.uk/">
          <img class="project-logo" src="https://repairs.kendell.uk/favicon/favicon.svg" alt="">
          <span class="project-copy">
            <span class="project-title">Boat repairs</span>
            <span class="project-description">Repair records and workshop guidance.</span>
          </span>
          <span class="project-arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </main>
  </div>
</body>
</html>
